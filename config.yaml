# k5n-mcp-hub — LOCAL DEVELOPMENT configuration
# ============================================
#
# >> This file is tuned for running the hub on your own machine. Do not deploy it
# >> as-is. For a multi-user or internet-reachable deployment start from
# >> config.production.example.yaml instead, and read docs/operator-guide-obo.md.
#
# It documents every available option, and most values match the built-in defaults.
# Three deliberately do not, because they suit local work and nothing else:
#
#   storage.type: json                  (default: inmemory) persist across restarts
#   security.allow_private_networks:    (default: false)    reach localhost/LAN servers
#   auth.type: none                     (default: none)     no login for local use
#
# The hub warns at startup if it is bound to a non-loopback address with either no
# authentication or private networks enabled.
#
# To override any setting, uncomment and modify the relevant section(s).

# =============================================================================
# Server Configuration
# =============================================================================
# Controls the HTTP server binding and admin UI.
server:
  # http_port: The port number for the HTTP server to listen on.
  http_port: 8080

  # admin_ui: Whether to enable the admin web UI (servers page, etc.).
  admin_ui: true

# =============================================================================
# Storage Configuration
# =============================================================================
# Controls how server registry data is persisted.
storage:
  # type: Storage backend. Options: inmemory, json, redis.
  type: json

  # json: (Commented out) JSON file-based storage configuration.
  # json:
  #   path: "mcp_servers.json"

# =============================================================================
# Authentication Configuration
# =============================================================================
# Controls authentication and user registration.
auth:
  # type: Authentication mechanism. Options: basic, jwt, none.
  # Set to "none" for local/LAN testing so the admin UI can register servers without
  # credentials. Switch back to "basic" (and set basic_auth.register_pass) before any
  # non-trusted deployment. Use "jwt" to make the hub an OAuth resource server that
  # validates access tokens from your IdP (required for on-behalf-of; see docs/adr/).
  type: none

  # basic_auth: Basic authentication settings.
  basic_auth:
    # register_user: Username for initial admin registration.
    register_user: admin

    # register_pass: (Commented out) Password for initial admin registration.
    # WARNING: Default passwords shipped with applications are a security risk.
    # Uncomment and set a strong password before deploying to production.
    # register_pass: "YOUR_PASSWORD_HERE"

  # jwt: (Commented out) OAuth resource-server settings, used only when type is "jwt".
  # The hub validates inbound access tokens itself rather than trusting a fronting
  # proxy (docs/adr/0001-hub-validates-inbound-tokens.md). issuer, audience and
  # jwks_uri are all required — the hub refuses to start with any of them missing.
  # jwks_uri is not derived from the issuer because the path differs per IdP.
  # jwt:
  #   issuer: "https://idp.example.com/realms/mcp-hub"
  #   audience: "k5n-mcp-hub"
  #   jwks_uri: "https://idp.example.com/realms/mcp-hub/protocol/openid-connect/certs"
  #   # algorithms: empty means the asymmetric defaults (RS/PS/ES families).
  #   # Symmetric algorithms are refused: a JWKS holds public keys.
  #   algorithms: []
  #   # required_scopes: every one must be present or the token is rejected.
  #   required_scopes: []
  #   # leeway_seconds: clock-skew tolerance for exp/nbf.
  #   leeway_seconds: 0
  #   # resource: the hub's public identity in RFC 9728 metadata. Derived from the
  #   # request URL when empty; set it when running behind a reverse proxy.
  #   resource: ""

# =============================================================================
# Health Check Configuration
# =============================================================================
# Controls periodic health checks for registered MCP servers.
healthcheck:
  # enabled: Whether to enable automatic health checking. On by default; turn it off
  # if you do not want the hub making periodic outbound probes to every server.
  enabled: true

  # interval_seconds: How often (in seconds) to check server health.
  interval_seconds: 30

  # timeout_seconds: How long (in seconds) to wait for a health response.
  timeout_seconds: 5

  # failure_threshold: Number of consecutive failures before unregistering.
  failure_threshold: 3

  # auto_unregister: Whether to automatically remove failed servers.
  auto_unregister: false

  # response_fields: Fields to include in health check responses.
  response_fields:
    status: status
    uptime_seconds: uptime_seconds

# =============================================================================
# Trace Configuration
# =============================================================================
# Controls request/response tracing for debugging.
trace:
  # body_limit: Maximum number of body bytes to capture per request/response.
  body_limit: 10000

  # capture_sse: Whether to capture Server-Sent Events in traces.
  capture_sse: false


# Security
security:
  # Allow registering/probing MCP servers on localhost/LAN. Needed for local work and
  # wrong for anything exposed: an internet-reachable hub with this on is an SSRF pivot
  # into whatever network it sits in. The built-in default is false.
  allow_private_networks: true
