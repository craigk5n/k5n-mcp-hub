# k5n-mcp-hub — LOCAL DEVELOPMENT configuration
# ============================================
#
# >> This file is tuned for running the hub on your own machine. Do not deploy it
# >> as-is. For a multi-user or internet-reachable deployment start from
# >> config.production.example.yaml instead, and read docs/operator-guide-obo.md.
#
# It documents every available option, and most values match the built-in defaults.
# Three deliberately do not, because they suit local work and nothing else:
#
#   storage.type: json                  (default: inmemory) persist across restarts
#   security.allow_private_networks:    (default: false)    reach localhost/LAN servers
#   auth.type: none                     (default: none)     no login for local use
#
# The hub warns at startup if it is bound to a non-loopback address with either no
# authentication or private networks enabled.
#
# To override any setting, uncomment and modify the relevant section(s).

# =============================================================================
# Server Configuration
# =============================================================================
# Controls the HTTP server binding and admin UI.
server:
  # http_port: The port number for the HTTP server to listen on.
  http_port: 8080

  # public_base_url: Where clients actually reach this hub, if that differs from the
  # address above. Leave empty for a plain local install.
  #
  # The hub cannot work this out for itself. In a container it binds 0.0.0.0:8080
  # while the port may be published as `-p 127.0.0.1:3001:8080`; behind a reverse
  # proxy it may be https://hub.example.com with no port at all. Anything the hub
  # generates for someone else to run -- today, the downloadable tool scripts -- uses
  # this when set, so those scripts point somewhere the user can actually reach.
  #
  #   public_base_url: "https://hub.example.com"
  #   public_base_url: "http://127.0.0.1:3001"
  public_base_url: ""

  # admin_ui: Whether to enable the admin web UI (servers page, etc.).
  admin_ui: true

# =============================================================================
# Storage Configuration
# =============================================================================
# Controls how server registry data is persisted.
storage:
  # type: Storage backend. Options: inmemory, json, redis.
  type: json

  # json: (Commented out) JSON file-based storage configuration.
  # json:
  #   path: "mcp_servers.json"

# =============================================================================
# Authentication Configuration
# =============================================================================
# Controls authentication and user registration.
auth:
  # type: Authentication mechanism. Options: basic, jwt, none.
  # Set to "none" for local/LAN testing so the admin UI can register servers without
  # credentials. Switch back to "basic" (and set basic_auth.register_pass) before any
  # non-trusted deployment. Use "jwt" to make the hub an OAuth resource server that
  # validates access tokens from your IdP (required for on-behalf-of; see docs/adr/).
  type: none

  # basic_auth: Basic authentication settings.
  basic_auth:
    # register_user: Username for initial admin registration.
    register_user: admin

    # register_pass: (Commented out) Password for initial admin registration.
    # WARNING: Default passwords shipped with applications are a security risk.
    # Uncomment and set a strong password before deploying to production.
    # register_pass: "YOUR_PASSWORD_HERE"

  # jwt: (Commented out) OAuth resource-server settings, used only when type is "jwt".
  # The hub validates inbound access tokens itself rather than trusting a fronting
  # proxy (docs/adr/0001-hub-validates-inbound-tokens.md). issuer, audience and
  # jwks_uri are all required — the hub refuses to start with any of them missing.
  # jwks_uri is not derived from the issuer because the path differs per IdP.
  # jwt:
  #   issuer: "https://idp.example.com/realms/mcp-hub"
  #   audience: "k5n-mcp-hub"
  #   jwks_uri: "https://idp.example.com/realms/mcp-hub/protocol/openid-connect/certs"
  #   # algorithms: empty means the asymmetric defaults (RS/PS/ES families).
  #   # Symmetric algorithms are refused: a JWKS holds public keys.
  #   algorithms: []
  #   # required_scopes: every one must be present or the token is rejected.
  #   required_scopes: []
  #   # leeway_seconds: clock-skew tolerance for exp/nbf.
  #   leeway_seconds: 0
  #   # resource: the hub's public identity in RFC 9728 metadata. Derived from the
  #   # request URL when empty; set it when running behind a reverse proxy.
  #   resource: ""

# =============================================================================
# Health Check Configuration
# =============================================================================
# Controls periodic health checks for registered MCP servers.
healthcheck:
  # enabled: Whether to enable automatic health checking. On by default; turn it off
  # if you do not want the hub making periodic outbound probes to every server.
  enabled: true

  # interval_seconds: How often (in seconds) to check server health.
  interval_seconds: 30

  # timeout_seconds: How long (in seconds) to wait for a health response.
  timeout_seconds: 5

  # failure_threshold: Number of consecutive failures before unregistering.
  failure_threshold: 3

  # auto_unregister: Whether to automatically remove failed servers.
  auto_unregister: false

  # response_fields: Fields to include in health check responses.
  response_fields:
    status: status
    uptime_seconds: uptime_seconds

# =============================================================================
# Trace Configuration
# =============================================================================
# Controls request/response tracing for debugging.
discovery:
  # enabled: Whether to periodically re-discover each server's tools, prompts and
  # resources. On by default. Separate from `healthcheck` because it costs more: a
  # health check is one cheap probe, while discovery performs a full handshake plus
  # three list calls against every registered server. Turn it off to keep health
  # monitoring without that traffic — capabilities then refresh only at registration
  # and when you press "Refresh capabilities" in the admin UI.
  enabled: true

  # interval_seconds: How often (in seconds) to re-discover capabilities. This is a
  # floor, not a schedule: servers returning `ttlMs` pacing hints are not re-polled
  # before those hints expire.
  #
  # 10 minutes rather than the 30s default: discovery is a full handshake plus three
  # list calls against every registered server, and this hub fronts remote production
  # sites. Capability sets change rarely; reachability is the health checker's job and
  # still runs every 30s.
  interval_seconds: 600

stdio:
  # enabled: Whether stdio MCP servers (programs, not URLs) may be registered.
  #
  # OFF BY DEFAULT, AND DELIBERATELY AWKWARD TO TURN ON. Every other backend is a
  # URL: the hub connects out, and a hostile registration is bounded by the
  # SSRF-pinned transport. A stdio server is a command line, so registering one asks
  # the hub to fork and exec it.
  #
  # Registration is restricted to admins only under `auth.type: jwt` -- `none` and
  # `basic` are single-user modes where everyone is an admin -- so the hub REFUSES TO
  # START if this is true while auth.type is anything else. See
  # docs/adr/0007-stdio-servers-are-opt-in-and-service-identity-only.md.
  enabled: false

  # allowed_commands: The programs a stdio server may be registered against, by name.
  # A registration names an entry here; it can supply neither the binary nor its
  # arguments, which keeps argument injection out of reach by construction.
  #
  # stdio servers run under a single service identity shared by all callers -- one
  # process cannot act as two users -- so `auth_type: obo` and `ema` are refused for
  # them. `required_scope` still governs who may reach the server.
  #
  # allowed_commands:
  #   everything:
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-everything"]
  #     env: {LOG_LEVEL: "info"}
  #     cwd: ""
  allowed_commands: {}

registry:
  # base_url: The MCP registry the import flow reads from. Point this at a private
  # registry to use one instead of the public index.
  #
  # Read-only by design: the hub imports servers from a registry but never publishes
  # to one, so there is no credential here. Its own records hold internal URLs and
  # stored secrets, and the public index is append-only -- see
  # docs/adr/0008-registry-import-yes-publish-no.md. "Export" means writing a
  # server.json you review and publish yourself with the official CLI.
  base_url: "https://registry.modelcontextprotocol.io"

trace:
  # body_limit: Maximum number of body bytes to capture per request/response.
  body_limit: 10000

  # capture_sse: Whether to capture Server-Sent Events in traces.
  capture_sse: false


# Security
security:
  # Allow registering/probing MCP servers on localhost/LAN. Needed for local work and
  # wrong for anything exposed: an internet-reachable hub with this on is an SSRF pivot
  # into whatever network it sits in. The built-in default is false.
  allow_private_networks: true

otel:
  # OpenTelemetry export. OFF BY DEFAULT and an optional install.
  #
  # Distinct from `trace:` above, which captures request/response bodies for the admin
  # UI and never leaves this process. This section sends data about every request to a
  # collector -- a third party with its own retention and access control. See
  # docs/adr/0009-opentelemetry-is-optional-and-redacted.md.
  #
  # Requires: pip install 'k5n-mcp-hub[otel]'. Enabling it without those packages is a
  # startup error rather than a silent no-op, because telemetry that quietly exports
  # nothing looks exactly like telemetry that works.
  enabled: false

  # endpoint: Base URL of an OTLP/HTTP collector, e.g. http://localhost:4318.
  # Required when enabled.
  endpoint: ""

  # service_name: How this hub identifies itself in your collector.
  service_name: "k5n-mcp-hub"

  # headers: Sent to the collector, for one that needs a credential.
  headers: {}

  # include_subject: Whether the calling user's `sub` claim is attached to spans.
  #
  # OFF BY DEFAULT, and think before turning it on: it puts user identities into a
  # second system, possibly one you do not operate. Spans always carry the server id
  # and outcome; this only adds who made the call. Never exported either way: tokens,
  # headers, bodies, and URL query strings.
  include_subject: false
