<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MCP Hub icon: terminal prompt fanning out to servers">
  <rect width="64" height="64" rx="14" fill="#0d1117"/>
  <!-- prompt chevron -->
  <polyline points="13,20 25,32 13,44" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- fan-out lines -->
  <g stroke="#475569" stroke-width="2.5" stroke-linecap="round">
    <line x1="31" y1="32" x2="45" y2="16"/>
    <line x1="31" y1="32" x2="49" y2="32"/>
    <line x1="31" y1="32" x2="45" y2="48"/>
  </g>
  <!-- server nodes -->
  <g fill="#22d3ee">
    <rect x="42" y="11" width="10" height="10" rx="3"/>
    <rect x="46" y="27" width="10" height="10" rx="3"/>
    <rect x="42" y="43" width="10" height="10" rx="3"/>
  </g>
  <g fill="#0d1117">
    <circle cx="47" cy="16" r="1.6"/>
    <circle cx="51" cy="32" r="1.6"/>
    <circle cx="47" cy="48" r="1.6"/>
  </g>
  <circle cx="31" cy="32" r="3.5" fill="#f97316"/>
</svg>
