<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agents - k5n-mcp-hub</title>
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/hyperscript.min.js"></script>
    <script src="/static/vendor/tailwind.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8 text-gray-800">Agents</h1>
        
        {% if not agents %}
        <div class="bg-white rounded-lg shadow p-6">
            <p class="text-gray-500">No agents registered</p>
        </div>
        {% else %}
        <div class="grid gap-6">
            {% for agent in agents %}
            <div 
                class="bg-white rounded-lg shadow p-6"
                data-agent-card
                data-agent-id="{{ agent.id }}"
                data-agent-name="{{ agent.name }}"
                data-agent-version="{{ agent.version }}"
                data-agent-description="{{ agent.description }}"
                data-agent-url="{{ agent.url }}"
            >
                <div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <h2 class="text-xl font-semibold text-gray-900">{{ agent.name }}</h2>
                            {% if agent.version %}
                            <span class="text-sm text-gray-500">v{{ agent.version }}</span>
                            {% endif %}
                            <div 
                                hx-get="/api/agents/{{ agent.id }}/card-status" 
                                hx-trigger="load delay:500ms, every 20s" 
                                hx-swap="innerHTML"
                            ></div>
                        </div>
                        
                        {% if agent.description %}
                        <p class="text-gray-600 mb-3">{{ agent.description }}</p>
                        {% endif %}
                    </div>
                    
                    <div class="lg:w-1/3 lg:text-right">
                        <p class="text-sm text-gray-500 mb-1">
                            <span class="font-medium">ID:</span> {{ agent.id }}
                        </p>
                        <p class="text-sm text-gray-500 mb-3 break-all">
                            <span class="font-medium">URL:</span> {{ agent.url }}
                        </p>
                        
                        <div class="flex flex-wrap gap-2 lg:justify-end">
                            <button 
                                class="px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 rounded transition-colors"
                                hx-get="/ui/agent/{{ agent.id }}/workbench"
                                hx-target="#workbench-{{ agent.id }}"
                                hx-swap="innerHTML"
                            >Open Workbench</button>
                            
                            <button 
                                class="px-3 py-1.5 text-sm bg-blue-100 hover:bg-blue-200 text-blue-800 rounded transition-colors"
                                hx-get="/ui/agent/{{ agent.id }}/refresh-card"
                                hx-target="#card-status-{{ agent.id }}"
                                hx-swap="innerHTML"
                            >Refresh Card</button>
                        </div>
                    </div>
                </div>
                
                <div id="card-status-{{ agent.id }}" class="mt-4 flex flex-wrap gap-2"></div>
                
                <div id="workbench-{{ agent.id }}" class="mt-4 hidden"></div>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</body>
</html>
