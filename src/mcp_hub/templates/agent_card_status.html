{% if agent.card_valid is none %}
<span class="bg-slate-100 text-slate-700 border border-slate-200 px-2 py-1 rounded text-xs">🕐 Unknown</span>
{% elif agent.card_valid %}
<span class="bg-emerald-100 text-emerald-800 border border-emerald-200 px-2 py-1 rounded text-xs">✓ Valid</span>
{% else %}
<span class="bg-red-100 text-red-800 border border-red-200 px-2 py-1 rounded text-xs">✗ Invalid</span>
{% endif %}
{% if agent.card_issues and agent.card_issues|length > 0 %}
<div class="mt-1">
    {% for issue in agent.card_issues %}
    <div class="text-xs text-amber-700">{{ issue }}</div>
    {% endfor %}
</div>
{% endif %}
