<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Workbench - DevHub</title>
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/hyperscript.min.js"></script>
    <script src="/static/vendor/tailwind.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8 text-gray-800">Agent Workbench: {{ agent.name }}</h1>
        
        <div class="bg-white rounded-lg shadow p-6">
            <div class="mb-4">
                <label for="saved-fixtures" class="block text-sm font-medium text-gray-700 mb-2">Saved Fixtures</label>
                <select 
                    id="saved-fixtures" 
                    name="saved_fixture"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    hx-get="/ui/agent/{{ agent.id }}/load-fixture"
                    hx-target="#stock-payload"
                    hx-include="[name='saved_fixture']"
                >
                    <option value="">-- Select a fixture --</option>
                    {% if fixtures %}
                    {% for fixture in fixtures %}
                    <option value="{{ fixture.id }}">{{ fixture.name }}</option>
                    {% endfor %}
                    {% endif %}
                </select>
            </div>
            
            <div class="mb-4">
                <label for="request-id" class="block text-sm font-medium text-gray-700 mb-2">Request ID</label>
                <input 
                    type="text" 
                    id="request-id" 
                    name="request_id"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="auto-generated if empty"
                    value=""
                >
            </div>
            
            <div class="mb-4">
                <label for="headers" class="block text-sm font-medium text-gray-700 mb-2">Headers (JSON)</label>
                <textarea 
                    id="headers" 
                    name="headers"
                    rows="3"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-mono text-sm"
                    placeholder='{"Content-Type": "application/json"}'
                ></textarea>
            </div>
            
            <div class="mb-4">
                <label for="stock-payload" class="block text-sm font-medium text-gray-700 mb-2">Stock Payload</label>
                <textarea 
                    id="stock-payload" 
                    name="stock_payload"
                    rows="10"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-mono text-sm"
                    placeholder='{"jsonrpc": "2.0", "id": 1, "method": "...", "params": {}}'
                >{{ stock_payload }}</textarea>
            </div>
            
            <div class="flex flex-wrap gap-2">
                <button 
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded transition-colors"
                    hx-post="/ui/agent/{{ agent.id }}/invoke"
                    hx-target="#invoke-result-{{ agent.id }}"
                    hx-include="#stock-payload, #request-id, #headers"
                >Invoke</button>
                
                <button 
                    class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-medium rounded transition-colors"
                    hx-post="/ui/agent/{{ agent.id }}/save-as-fixture"
                    hx-target="#fixture-message-{{ agent.id }}"
                    hx-include="#stock-payload"
                >Save as Fixture</button>
            </div>
            
            <div id="fixture-message-{{ agent.id }}" class="mt-2"></div>
            
            <div id="invoke-result-{{ agent.id }}" class="mt-6"></div>
        </div>
    </div>
</body>
</html>
