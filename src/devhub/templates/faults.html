<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fault Injection - DevHub</title>
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/tailwind.js"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Fault Injection Settings</h1>
        
        <form method="post" action="/ui/server/{{ server_id }}/faults" class="bg-white rounded-lg shadow p-6 space-y-6">
            <input type="hidden" name="server_id" value="{{ server_id }}">
            
            <div class="flex items-center">
                <input type="checkbox" id="enabled" name="enabled" {% if enabled %}checked{% endif %}
                       class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label for="enabled" class="ml-2 text-sm font-medium text-gray-700">Enable Fault Injection</label>
            </div>
            
            <div class="border-t pt-4">
                <div class="flex items-center mb-4">
                    <input type="checkbox" id="timeout_enabled" name="timeout_enabled" {% if timeout_enabled %}checked{% endif %}
                           class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                    <label for="timeout_enabled" class="ml-2 text-sm font-medium text-gray-700">Enable Timeout</label>
                </div>
                
                <div class="ml-6">
                    <label for="timeout_millis" class="block text-sm text-gray-600 mb-1">Timeout (milliseconds)</label>
                    <input type="number" id="timeout_millis" name="timeout_millis" value="{{ timeout_millis }}" min="1" max="60000"
                           class="w-32 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
            </div>
            
            <div class="border-t pt-4">
                <div class="flex items-center mb-3">
                    <input type="checkbox" id="malformed_json" name="malformed_json" {% if malformed_json %}checked{% endif %}
                           class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                    <label for="malformed_json" class="ml-2 text-sm font-medium text-gray-700">Malformed JSON Response</label>
                </div>
                
                <div class="flex items-center mb-3">
                    <input type="checkbox" id="invalid_method" name="invalid_method" {% if invalid_method %}checked{% endif %}
                           class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                    <label for="invalid_method" class="ml-2 text-sm font-medium text-gray-700">Invalid Method Error</label>
                </div>
                
                <div class="flex items-center">
                    <input type="checkbox" id="sse_interrupt" name="sse_interrupt" {% if sse_interrupt %}checked{% endif %}
                           class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                    <label for="sse_interrupt" class="ml-2 text-sm font-medium text-gray-700">SSE Interrupt</label>
                </div>
            </div>
            
            <div class="border-t pt-4">
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Save Settings
                </button>
            </div>
        </form>
    </div>
</body>
</html>
