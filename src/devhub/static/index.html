<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Development Hub</title>
    <!-- Vendored locally so the hub works offline / on a LAN with no external CDN access. -->
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/json-enc.js"></script>
    <script src="/static/vendor/hyperscript.min.js"></script>
    <script src="/static/vendor/js-yaml.min.js"></script>
    <script src="/static/vendor/tailwind.js"></script>
</head>
<body class="bg-gray-50">
    <header class="bg-white shadow">
        <div class="max-w-7xl mx-auto py-6 px-4">
            <h1 class="text-3xl font-bold text-gray-900">MCP Development Hub</h1>
            <p class="mt-1 text-gray-600">Local MCP Service Registry</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-6 px-4">
        <div id="server-list" hx-get="/ui/servers" hx-trigger="load, refresh" hx-swap="innerHTML"
             hx-on::response-error="this.innerHTML = '<p class=\'text-red-500\'>Failed to load servers. Please refresh the page.</p>'">
            <p class="text-gray-500">Loading servers...</p>
        </div>

        <div class="mt-8 bg-white shadow rounded-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Add Server</h2>
            <!-- json-enc sends a JSON body (the API expects JSON, not form-encoding). On
                 success we reset the form and refresh the list; on error we surface the
                 server's message (e.g. 401 if auth is enabled, 422 for a bad field). -->
            <form hx-post="/v1/register" hx-ext="json-enc" hx-swap="none"
                  hx-on::after-request="if (event.detail.successful) { this.reset(); htmx.trigger('#server-list','refresh'); } else { alert('Add server failed (HTTP ' + event.detail.xhr.status + '): ' + event.detail.xhr.responseText); }">
                <div class="grid gap-4 mb-4 md:grid-cols-3">
                    <div>
                        <label for="server-id" class="block mb-2 text-sm font-medium text-gray-900">Server ID</label>
                        <input type="text" id="server-id" name="id" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="my-server" required>
                    </div>
                    <div>
                        <label for="server-name" class="block mb-2 text-sm font-medium text-gray-900">Server Name</label>
                        <input type="text" id="server-name" name="name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="My Server">
                    </div>
                    <div>
                        <label for="server-url" class="block mb-2 text-sm font-medium text-gray-900">Server URL</label>
                        <input type="url" id="server-url" name="url" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="http://localhost:8000/mcp" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="server-token" class="block mb-2 text-sm font-medium text-gray-900">Bearer token <span class="text-gray-400 font-normal">(optional — required for auth-protected MCP servers)</span></label>
                    <input type="password" id="server-token" name="bearer_token" autocomplete="off" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="paste the server's API token">
                </div>
                <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 focus:outline-none">Add Server</button>
            </form>
        </div>
    </main>
</body>
</html>
