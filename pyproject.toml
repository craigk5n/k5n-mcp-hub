[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "k5n-mcp-hub"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Pinned to 2.x with an upper bound: 2.0 renamed the client APIs this codebase
    # uses (streamablehttp_client -> streamable_http_client, InitializeResult's
    # camelCase attrs -> snake_case, ClientNotification from a wrapper model to a
    # union type), so a major bump here is a migration, not a version bump.
    "mcp>=2.1,<3",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    # Imported directly by utils.py: `mcp` 2.x speaks httpx2, so the SSRF-pinned
    # transport has to exist on that stack too. Declared rather than leaned on as an
    # mcp transitive, since we import it ourselves.
    "httpx2>=2.5.0",
    # [crypto] pulls in `cryptography`, which the JWKS parser needs to turn a JWK
    # into a verifying key (auth/jwt_bearer.py). Story 5.2.
    "pyjwt[crypto]>=2.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "fastapi>=0.110.0",
    "jinja2>=3.1.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
k5n-mcp-hub = "mcp_hub.__main__:main"

[tool.setuptools.packages.find]
# Tolerate both flat (./pkg) and src (./src/pkg) layouts; never package tests.
where = ["src", "."]
exclude = ["tests*"]

[tool.setuptools.package-data]
# Ship the Jinja2 templates and static assets inside the wheel. Without this the admin UI
# 500s on any real `pip install` (the app resolves them relative to the installed package,
# not the repo). Enumerated by directory so it doesn't depend on setuptools ** glob support.
mcp_hub = [
    "templates/*.html",
    "templates/*.j2",
    "static/*",
    "static/vendor/*",
    "static/images/*",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Tests may import a module just to assert it's importable (F401) or to set up
# fixtures; don't let lint rules meant for app code fail the test suite.
"tests/*" = ["F401", "F811"]
# Package __init__.py files routinely re-export symbols for the public API.
"__init__.py" = ["F401"]

[tool.ruff.lint]
exclude = ["src/mcp_hub/static/", "src/mcp_hub/templates/"]

[tool.mypy]
# Lenient static type-checking: resolve the src/ layout, tolerate third-party
# packages without stubs, and don't type-check the test suite.
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"
exclude = "(^|/)(tests|build|dist)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
